[project]
name = "nimbus"
version = "0.1.0"
description = "Nimbus -- AI predictive weather analysis for India: rainfall map, chatbot, and forecasting"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "xarray==2026.7.0",
    "netCDF4==1.7.4",
    "requests==2.34.2",
    "httpx==0.28.1",
    "ollama==0.6.2",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.0",
    "pillow==12.3.0",
    "click==8.4.2",
    "anthropic==1.0.0",
    "tqdm==4.70.0",
    "cdsapi==0.7.7",
]

[project.optional-dependencies]
# Kept optional (rather than a base dependency) for two reasons: torch has no 32-bit
# build at all -- `uv sync` alone must succeed on a 32-bit machine that will never run
# the satellite nowcast CNN -- and its CPU wheel has a documented history of crashing
# with "Illegal instruction" on CPUs without AVX2 (pre-Haswell/3rd-gen-or-older Intel
# Core, e.g. Ivy Bridge). Add it explicitly with `uv sync --extra torch` only on a
# 64-bit machine with AVX2 support.
torch = ["torch==2.13.0+cpu"]

[project.scripts]
nimbus = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file modules at the repo root (app.py, cli.py) plus the weather package --
# this project is run in place (uv run nimbus ...), not installed elsewhere, but
# hatchling still needs to know what a wheel build would contain.
packages = ["weather"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
