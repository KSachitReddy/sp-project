<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rainfall Chat — India</title>
<style>
  :root{
    color-scheme: dark;
    --bg:            #08080a;
    --bg-glow:       #17171a;
    --surface:       #111113;
    --surface-raised:#1c1c1f;
    --hairline:      rgba(255,255,255,0.09);
    --hairline-2:    rgba(255,255,255,0.16);
    --ink:           #f3f3f4;
    --ink-secondary: #aaaaae;
    --ink-muted:     #737377;
    --accent:        #e7e7e9;
    --accent-soft:   rgba(255,255,255,0.14);
    --bubble-user:   #26262b;
    --bubble-error:  #3a1f1f;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      radial-gradient(ellipse 900px 560px at 72% -8%, var(--bg-glow) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 8% 105%, #1a1a1d 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  ::selection{ background: var(--accent-soft); color: var(--ink); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .page{
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 28px 0 18px;
    border-bottom: 1px solid var(--hairline);
  }
  h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .subtitle{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  header a{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-secondary);
    text-decoration: none;
    border: 1px solid var(--hairline-2);
    border-radius: 20px;
    padding: 6px 14px;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  header a:hover{ color: var(--ink); border-color: var(--ink-secondary); }

  #log{
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row{ display: flex; }
  .row.user{ justify-content: flex-end; }
  .row.bot{ justify-content: flex-start; }

  .bubble{
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .row.user .bubble{
    background: var(--bubble-user);
    border: 1px solid var(--hairline-2);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-bottom-left-radius: 4px;
  }
  .row.bot .bubble.error{
    background: var(--bubble-error);
    border-color: rgba(255,120,120,0.28);
    color: #ffb4b4;
  }
  .row.bot .bubble.thinking{
    color: var(--ink-muted);
    font-style: italic;
  }

  .empty-hint{
    margin: auto 0;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
    padding: 40px 10px;
  }
  .empty-hint .examples{
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .example-btn{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-secondary);
    background: var(--surface);
    border: 1px solid var(--hairline-2);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .example-btn:hover{ color: var(--ink); border-color: var(--ink-secondary); }

  form{
    display: flex;
    gap: 10px;
    padding: 16px 0 24px;
    border-top: 1px solid var(--hairline);
  }
  #input{
    flex: 1;
    background: var(--surface-raised);
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14.5px;
    padding: 12px 14px;
    resize: none;
    outline: none;
  }
  #input:focus{ border-color: var(--ink-secondary); }
  #send{
    background: var(--accent);
    color: #0a0a0b;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  #send:disabled{ opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Rainfall Chat</h1>
      <div class="subtitle">IMD RF25 · 2018&ndash;2025 · states, union territories &amp; cities</div>
    </div>
    <a href="/">&larr; Map</a>
  </header>

  <div id="log">
    <div class="empty-hint" id="empty-hint">
      Ask how much it rained, where, and when.
      <div class="examples">
        <button class="example-btn" type="button" data-q="How much did it rain in Mumbai on 2023-07-15?">How much did it rain in Mumbai on 2023-07-15?</button>
        <button class="example-btn" type="button" data-q="Total rainfall in Kerala during August 2022">Total rainfall in Kerala during August 2022</button>
        <button class="example-btn" type="button" data-q="Compare rainfall in Chennai and Bengaluru on 2021-11-01">Compare rainfall in Chennai and Bengaluru on 2021-11-01</button>
      </div>
    </div>
  </div>

  <form id="chat-form">
    <textarea id="input" rows="1" placeholder="Ask about rainfall by place and date…" autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const emptyHint = document.getElementById("empty-hint");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let apiMessages = [];   // opaque conversation history round-tripped with the server
  let busy = false;

  function addRow(role, text, cls) {
    emptyHint.remove();
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (cls ? " " + cls : "");
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function send(text) {
    if (!text.trim() || busy) return;
    busy = true;
    sendBtn.disabled = true;
    addRow("user", text);
    const thinking = addRow("bot", "Looking that up…", "thinking");

    apiMessages.push({ role: "user", content: text });

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages }),
      });
      const data = await res.json();
      thinking.remove();
      if (!res.ok) {
        addRow("bot", data.error || "Something went wrong.", "error");
        apiMessages.pop(); // drop the unanswered turn so retrying doesn't duplicate it
      } else {
        apiMessages = data.messages;
        addRow("bot", data.reply || "(no reply)");
      }
    } catch (err) {
      thinking.remove();
      addRow("bot", "Couldn't reach the server — is it still running?", "error");
      apiMessages.pop();
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  document.querySelectorAll(".example-btn").forEach((btn) => {
    btn.addEventListener("click", () => send(btn.dataset.q));
  });
</script>
</body>
</html>
